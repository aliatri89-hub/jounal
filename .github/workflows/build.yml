name: Build journal
on:
  push:
    paths-ignore:
      - "output/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab pillow
      - run: python build_journal.py
      - name: Commit PDF to output/
        run: |
          mkdir -p output
          mv "Mantl Movie Journal - Vol "*.pdf output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/*.pdf
          git commit -m "Build journal PDF [skip ci]" || echo "no changes"
          git push
