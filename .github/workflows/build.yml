name: Build journal
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab pillow
      - run: python build_journal.py
      - uses: actions/upload-artifact@v4
        with:
          name: journal
          path: "Mantl Movie Journal - Vol *.pdf"
